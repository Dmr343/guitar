<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backing Track — Herramientas de Guitarra</title>
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <header class="header">
    <a href="../index.html" class="back-link" data-i18n-attr="title:back_title" title="Volver">←</a>
    <h1>Backing Track</h1>
    <span class="header-label" data-i18n="header_label">Práctica de improvisación</span>
  </header>

  <div class="app">

    <!-- ═══════════ ZONA DE TOQUE ═══════════ -->
    <section class="play-zone">

      <div class="transport">
        <button id="btn-play" class="btn btn-primary btn-play">▶&nbsp; Play</button>
        <span id="status" class="status" data-i18n="status_stopped">Detenido</span>
        <div class="transport-ctls">
          <div class="ctl">
            <label for="ctl-tempo" data-i18n="tempo">Tempo</label>
            <input type="range" id="ctl-tempo" min="40" max="240" step="1">
            <span class="value" id="val-tempo">100 BPM</span>
          </div>
          <div class="ctl">
            <label for="ctl-volume" data-i18n="volume">Volumen</label>
            <input type="range" id="ctl-volume" min="0" max="100" step="1">
            <span class="value" id="val-volume">85%</span>
          </div>
          <label class="ctl-loop">
            <input type="checkbox" id="ctl-loop" checked>
            <span data-i18n="loop">Loop</span>
          </label>
        </div>
      </div>

      <div class="now-playing">
        <div class="chord-now">
          <span class="chord-cap" data-i18n="chord_now_cap">Acorde</span>
          <span id="now-chord" class="chord-now-name">—</span>
        </div>
        <div class="chord-next">
          <span class="chord-cap" data-i18n="chord_next_cap">Sigue</span>
          <span id="next-chord" class="chord-next-name">—</span>
        </div>
        <div class="metro">
          <div id="beat-meter" class="beat-meter"></div>
          <select id="subdiv-select" class="subdiv-select" data-i18n-attr="title:subdiv_title" title="Subdivisión del metrónomo">
            <option value="redonda" data-i18n="subdiv_redonda">Redonda</option>
            <option value="blanca" data-i18n="subdiv_blanca">Blanca</option>
            <option value="negra" selected data-i18n="subdiv_negra">Negra</option>
            <option value="corchea" data-i18n="subdiv_corchea">Corchea</option>
            <option value="tresillo" data-i18n="subdiv_tresillo">Tresillo</option>
            <option value="semicorchea" data-i18n="subdiv_semicorchea">Semicorchea</option>
          </select>
        </div>
      </div>

      <div id="chord-strip" class="chord-strip"></div>

      <!-- Mixer en vivo: las pistas, el alta de instrumentos y el
           editor de sonido quedan accesibles aunque la configuración
           esté colapsada. -->
      <div class="mixer">
        <div class="section-label" data-i18n="tracks_label">Pistas</div>
        <div id="tracks"></div>
        <div class="add-track">
          <select id="add-tipo">
            <option value="bajo" data-i18n="tipo_bajo">Bajo</option>
            <option value="acordes" data-i18n="tipo_acordes">Acordes</option>
            <option value="bateria" data-i18n="tipo_bateria">Batería</option>
            <option value="percusion" data-i18n="tipo_percusion">Percusión</option>
            <option value="pad" data-i18n="tipo_pad">Pad</option>
            <option value="lead" data-i18n="tipo_lead">Lead</option>
          </select>
          <button id="btn-add" class="btn btn-secondary" data-i18n="btn_add_instrument">+ Agregar instrumento</button>
        </div>
        <div id="preset-editor" class="preset-editor" hidden></div>
      </div>

      <div id="diag-voices" class="diag" hidden>Voces activas: —</div>

    </section>

    <!-- ═══════════ CONFIGURACIÓN (colapsable) ═══════════ -->
    <section class="config" id="config">
      <button type="button" class="config-header" id="config-toggle"
              aria-expanded="true">
        <span class="config-title">
          <span class="config-title-main" data-i18n="config_title">Configuración</span>
          <span class="config-title-sub" data-i18n="config_subtitle">progresión · arreglo · proyecto</span>
        </span>
        <span class="chevron" id="config-chevron">▾</span>
      </button>

      <div class="config-body" id="config-body">

        <div class="mode-toggle">
          <button id="mode-practica" class="mode-btn active" data-i18n="mode_practice">Práctica</button>
          <button id="mode-arreglo" class="mode-btn" data-i18n="mode_arrange">Arreglo</button>
        </div>

        <div class="cfg-section">
          <div class="section-label" data-i18n="progression_label">Progresión</div>
          <div class="control-row">
            <label for="prog-select" data-i18n="factory_label">De fábrica</label>
            <select id="prog-select"></select>
            <label for="tonalidad-select" data-i18n="key_label">Tonalidad</label>
            <select id="tonalidad-select" disabled></select>
            <button id="btn-tonalidad-reset" class="btn btn-secondary"
                    data-i18n-attr="title:key_reset_title"
                    title="Volver a la tonalidad nativa de la progresión"
                    disabled>↻</button>
          </div>
          <div class="builder">
            <select id="new-root"></select>
            <select id="new-quality"></select>
            <button id="btn-add-chord" class="btn btn-secondary" data-i18n="btn_add_chord">+ Acorde</button>
            <button id="btn-clear-prog" class="btn btn-danger"
                    data-i18n-attr="title:btn_clear_prog_title"
                    title="Limpiar progresión" data-i18n="btn_clear_prog">Limpiar</button>
          </div>
          <div id="chord-editor" class="chord-editor" hidden></div>
        </div>

        <div id="arrange-panel" class="arrange-panel" hidden></div>

        <div class="cfg-section">
          <div class="section-label" data-i18n="project_label">Proyecto</div>
          <div class="control-row">
            <input type="text" id="proj-name" data-i18n-attr="placeholder:proj_name_ph" placeholder="Nombre del proyecto">
            <button id="btn-save-proj" class="btn btn-primary" data-i18n="btn_save">Guardar</button>
          </div>
          <div class="control-row">
            <select id="proj-select"></select>
            <button id="btn-load-proj" class="btn btn-secondary" data-i18n="btn_load">Cargar</button>
            <button id="btn-del-proj" class="btn btn-danger icon-btn"
                    data-i18n-attr="title:btn_del_proj_title"
                    title="Borrar proyecto seleccionado">🗑</button>
          </div>
          <div class="control-row project-io">
            <button id="btn-export" class="btn btn-secondary icon-btn"
                    data-i18n-attr="title:btn_export_title"
                    title="Exportar respaldo JSON">⭳ JSON</button>
            <button id="btn-import" class="btn btn-secondary icon-btn"
                    data-i18n-attr="title:btn_import_title"
                    title="Importar respaldo JSON">⭱ JSON</button>
            <input type="file" id="import-file" accept="application/json" hidden>
          </div>
        </div>

      </div>
    </section>

  </div>

  <!-- Tone.js vendorizado (file:// safe, sin internet). Ver vendor/README.md -->
  <script src="./vendor/Tone.js"></script>
  <!-- WebAudioFont: reproductor de soundfonts GM (instrumentos reales).
       El reproductor es local; los soundfonts se cargan por CDN. -->
  <script src="./vendor/WebAudioFontPlayer.js"></script>

  <!-- Motor i18n ES/EN compartido (file:// safe). Un nivel arriba. -->
  <script src="../i18n.js"></script>

  <!-- Dependencias compartidas del repo -->
  <script src="../shared/theory.js"></script>
  <!-- Modelo de progresión reutilizado del Intervalic Atlas (read-only) -->
  <script src="../intervallic/progression-model.js"></script>

  <!-- Módulos del backing track (orden = dependencias) -->
  <script src="./transpose.js"></script>
  <script src="./voicing.js"></script>
  <script src="./step-grid.js"></script>
  <script src="./scheduler.js"></script>
  <script src="./humanize.js"></script>
  <script src="./instruments.js"></script>
  <script src="./presets.js"></script>
  <script src="./patterns.js"></script>
  <script src="./progressions.js"></script>
  <script src="./grooves.js"></script>
  <script src="./user-library.js"></script>
  <script src="./storage.js"></script>
  <script src="./integration.js"></script>
  <script src="./engine.js"></script>
  <script src="./app.js"></script>
