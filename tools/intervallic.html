<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interval Atlas</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    /* ─── Interval Atlas (dark estudio) — consume tokens de theme.css ─── */
    :root {
      /* Tool-specific: acento amarillo Atlas + variante apagada */
      --accent:     var(--c-atlas);
      --accent-dim: #3a2e0a;
      /* gold-dim legacy → mapea al acento apagado */
      --gold-dim:   var(--accent-dim);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{zoom:1.4}
    body{min-height:100vh;padding:clamp(16px,3vw,28px)}
    a.back{
      font-family:var(--font-mono);font-size:var(--fs-small);color:var(--text-mid);
      text-decoration:none;letter-spacing:.06em;display:inline-block;
      transition:color var(--dur) var(--ease),transform var(--dur-fast) var(--ease)
    }
    a.back:hover{color:var(--accent);transform:translateX(-2px)}
    h1{
      font-family:var(--font-display);font-size:var(--fs-h1);font-weight:700;
      letter-spacing:-0.01em;margin:14px 0 4px;
      background:linear-gradient(165deg,#fff 6%,var(--accent) 58%,#b88a2e 100%);
      -webkit-background-clip:text;background-clip:text;
      -webkit-text-fill-color:transparent;color:transparent;width:max-content;max-width:100%
    }
    .subtitle{color:var(--text-mid);font-size:var(--fs-small);margin-bottom:18px}

    .panel-layout{display:grid;grid-template-columns:1fr 320px;gap:14px}
    .panel-layout.collapsed{grid-template-columns:1fr}
    .panel-layout.collapsed .side-panel{display:none}
    .panel-layout.collapsed #atlas-panel-show{display:inline-flex}
    @media(max-width:1100px){.panel-layout{grid-template-columns:1fr}}

    .fretboard-wrap{
      background:linear-gradient(180deg,var(--surface2),var(--surface));
      border:1px solid var(--border);border-radius:var(--radius);padding:16px;
      overflow-x:auto;min-width:0;box-shadow:var(--shadow-1)
    }
    #atlas-fretboard{display:block;width:100%;height:auto;max-width:1600px}
    .side-panel{
      background:linear-gradient(180deg,var(--surface2),var(--surface));
      border:1px solid var(--border);border-radius:var(--radius);padding:16px;
      min-height:300px;position:relative;box-shadow:var(--shadow-1)
    }
    .panel-toggle{
      position:absolute;top:10px;right:10px;background:var(--surface3);
      border:1px solid var(--border);color:var(--text-mid);font-family:var(--font-mono);
      font-size:14px;line-height:1;padding:3px 9px;border-radius:var(--radius-sm);cursor:pointer;z-index:2;
      transition:border-color var(--dur) var(--ease),color var(--dur) var(--ease),transform var(--dur-fast) var(--ease)
    }
    .panel-toggle:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
    /* Botón "Editor" (reabrir panel): vive inline en la fila del Play, pegado a
       la derecha; visible solo cuando el panel está colapsado. Usa .btn para el
       resto del estilo. */
    #atlas-panel-show{display:none;margin-left:auto;align-items:center;gap:6px}
    .side-panel h3{
      font-family:var(--font-mono);font-size:var(--fs-micro);letter-spacing:.18em;
      color:var(--text-dim);text-transform:uppercase;margin-bottom:12px
    }

    .row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;font-size:var(--fs-small);color:var(--text-mid)}
    .row label{display:inline-flex;gap:5px;align-items:center}

    select, input[type=number], input[type=text]{
      background:var(--surface3);border:1px solid var(--border);color:var(--text);
      font-family:var(--font-mono);font-size:var(--fs-small);padding:6px 9px;border-radius:var(--radius-sm);
      transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)
    }
    select:hover, input[type=number]:hover, input[type=text]:hover{border-color:var(--border2)}
    select:focus, input[type=number]:focus, input[type=text]:focus{
      outline:none;border-color:color-mix(in srgb,var(--accent) 55%,var(--border));
      box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)
    }
    .btn{
      background:var(--surface3);border:1px solid var(--border);color:var(--text);
      font-family:var(--font);font-size:var(--fs-small);padding:7px 13px;border-radius:var(--radius-sm);cursor:pointer;
      transition:border-color var(--dur) var(--ease),color var(--dur) var(--ease),
                 transform var(--dur-fast) var(--ease),box-shadow var(--dur) var(--ease)
    }
    .btn:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--border));color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.4)}
    .btn:active{transform:translateY(0)}
    .btn.primary{
      background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 92%,#fff),var(--accent));
      color:#1a1405;border-color:var(--accent);font-weight:700;
      box-shadow:0 6px 18px var(--glow)
    }
    .btn.primary:hover{color:#1a1405;box-shadow:0 10px 26px var(--glow),var(--shadow-1)}
    .btn.danger{color:#e8736a;border-color:#3a1a1a}
    .btn.danger:hover{color:#ff8a80;border-color:#e74c3c}

    .layer-toggles{
      display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 12px;padding:10px 14px;
      background:var(--surface3);border:1px solid var(--border);border-radius:var(--radius-sm)
    }
    .layer-toggle{display:inline-flex;gap:5px;align-items:center;font-size:var(--fs-small);color:var(--text-mid);cursor:pointer}
    .layer-toggle:hover{color:var(--text)}

    .progression-bar{
      display:flex;gap:6px;background:var(--surface3);border:1px solid var(--border);
      padding:10px;border-radius:var(--radius-sm);flex-wrap:wrap;align-items:center;margin-bottom:10px;min-height:48px
    }
    .prog-chord{
      background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-sm);
      padding:7px 11px;font-size:var(--fs-small);display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:2px;min-width:60px;position:relative;cursor:pointer;
      transition:transform var(--dur-fast) var(--ease), opacity var(--dur-fast) var(--ease),
                 box-shadow var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
      user-select:none
    }
    .prog-chord:hover{border-color:color-mix(in srgb,var(--accent) 60%,var(--border));box-shadow:0 0 0 1px var(--accent),0 6px 16px rgba(0,0,0,.4);transform:translateY(-2px)}
    .prog-chord.active{border-color:var(--accent);background:#1d1810;box-shadow:0 0 14px var(--glow)}
    .prog-chord.beat{transform:scale(1.06);transition:transform .09s ease-out}
    .prog-chord.downbeat{background:var(--accent-dim);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 70%,transparent);transition:background .14s ease-out, box-shadow .14s ease-out}
    .prog-chord.dragging{opacity:.45;transform:scale(.95)}
    .prog-chord.drag-over{outline:2px dashed var(--accent);outline-offset:2px}
    .prog-chord.in-loop{box-shadow:inset 0 -3px 0 #9b59b6}
    .prog-chord[draggable=true]{cursor:grab}
    .prog-chord[draggable=true]:active{cursor:grabbing}
    .prog-chord .pc-bars-vis{font-family:var(--font-mono);font-size:8px;color:var(--text-dim);letter-spacing:1px;line-height:1}
    .prog-chord .pc-del{position:absolute;top:1px;right:2px;background:transparent;border:none;color:var(--text-dim);font-size:13px;line-height:1;padding:1px 4px;cursor:pointer;opacity:0;transition:opacity var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease);border-radius:3px}
    .prog-chord:hover .pc-del{opacity:.7}
    .prog-chord .pc-del:hover{opacity:1;color:#e74c3c;background:rgba(231,76,60,.12)}
    .btn.playing{background:#e74c3c;color:#fff;border-color:#e74c3c;animation:pulse 1s ease-in-out infinite}
    .btn.paused{background:var(--accent);color:#1a1405;border-color:var(--accent)}
    .btn.tap-pulse{transform:scale(1.1);transition:transform var(--dur-fast) var(--ease)}
    .beat-meter{display:inline-flex;gap:4px;padding:3px 7px;background:var(--surface3);border:1px solid var(--border);border-radius:var(--radius-sm);align-items:center;height:28px}
    .beat-dot{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:50%;background:var(--bg-2);border:1px solid var(--border);font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--text-dim);transition:background .08s,color .08s,transform .08s}
    .beat-dot.downbeat{color:var(--accent);border-color:var(--accent-dim)}
    .beat-dot.on{background:var(--text);color:#000;transform:scale(1.18)}
    .beat-dot.downbeat.on{background:var(--accent);color:#000}
    .toggle{display:inline-flex;gap:5px;align-items:center;font-size:var(--fs-small);color:var(--text-mid);cursor:pointer}
    @keyframes pulse{50%{opacity:.7}}
    .filters-block{background:var(--surface3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 13px;margin-bottom:10px}
    .filters-block summary{cursor:pointer;font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--text-dim);text-transform:uppercase;letter-spacing:.12em;outline:none;list-style:none;transition:color var(--dur) var(--ease)}
    .filters-block summary:hover{color:var(--text-mid)}
    .filters-block summary::-webkit-details-marker{display:none}
    .filters-block[open] summary{color:var(--accent)}
    .edit-popover{position:fixed;background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--accent);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow-2),0 0 24px var(--glow);z-index:1000;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .edit-popover-title{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.12em;width:100%}
    .edit-popover-actions{display:flex;gap:4px;margin-left:auto}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(3px);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
    .modal{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--border2);border-radius:var(--radius-lg);padding:20px;width:min(720px,100%);max-height:80vh;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-2),0 0 40px var(--glow)}
    .modal-header{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .modal-header h3{font-family:var(--font-display);font-weight:700;color:var(--accent);font-size:var(--fs-h2);letter-spacing:-.01em;text-transform:none}
    .modal-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);flex-wrap:wrap}
    .modal-tab{background:transparent;border:none;color:var(--text-mid);font-family:var(--font);font-size:var(--fs-small);padding:7px 13px;cursor:pointer;border-bottom:2px solid transparent;letter-spacing:.02em;transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
    .modal-tab:hover{color:var(--text)}
    .modal-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
    .modal-list{overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;padding:6px 2px}
    .preset-card{background:var(--surface3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;cursor:pointer;transition:border-color var(--dur) var(--ease),transform var(--dur-fast) var(--ease),box-shadow var(--dur) var(--ease)}
    .preset-card:hover{border-color:color-mix(in srgb,var(--accent) 60%,var(--border));transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.45)}
    .preset-card-name{font-family:var(--font-display);font-weight:700;color:var(--accent);font-size:var(--fs-small);margin-bottom:4px}
    .preset-card-chords{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--text-mid);line-height:1.5}
    .fav-list{display:flex;flex-direction:column;gap:4px;margin-top:8px}
    .fav-item{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 11px;background:var(--surface3);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:var(--fs-small);transition:border-color var(--dur) var(--ease)}
    .fav-item:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--border))}
    .fav-item-name{color:var(--text);cursor:pointer;flex:1;transition:color var(--dur) var(--ease)}
    .fav-item-name:hover{color:var(--accent)}
    .fav-item-del{cursor:pointer;color:var(--text-dim);padding:2px 6px;transition:color var(--dur) var(--ease)}
    .fav-item-del:hover{color:#e74c3c}
    .prog-chord .pc-name{font-family:var(--font-mono);font-weight:700;color:var(--accent);font-size:var(--fs-small)}

    .legend{display:flex;gap:6px;font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--text-mid);flex-wrap:wrap;margin-top:12px;align-items:center}
    .legend-dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:4px}
    .legend-toggle{background:var(--surface3);border:1px solid var(--border);color:var(--text-mid);font-family:var(--font-mono);font-size:var(--fs-micro);padding:4px 9px;border-radius:var(--radius-sm);cursor:pointer;display:inline-flex;align-items:center;gap:0;transition:opacity var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease)}
    .legend-toggle:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--border));color:var(--text);transform:translateY(-1px)}
    .legend-toggle.off{opacity:.35;text-decoration:line-through}
    .legend-toggle.is-chord{border-bottom:2px solid var(--accent)}
    .legend-toggle.reset{color:var(--accent);border-color:var(--accent-dim);margin-left:8px}

    .scales-block{margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
    .scales-block>summary{font-family:var(--font-mono);font-size:var(--fs-micro);letter-spacing:.04em;color:var(--text-dim);cursor:pointer;list-style:none;user-select:none;transition:color var(--dur-fast) var(--ease)}
    .scales-block>summary:hover{color:var(--text-mid)}
    .scales-block>summary::-webkit-details-marker{display:none}
    .scales-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
    .scale-btn{background:var(--surface3);border:1px solid var(--border);color:var(--text-mid);font-family:var(--font-mono);font-size:var(--fs-micro);padding:4px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:border-color var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease)}
    .scale-btn:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--border));color:var(--text);transform:translateY(-1px)}
    .scale-btn.active{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface3))}
    .scale-formula{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;min-height:18px;font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--text-mid)}
    .scale-formula .scale-name{color:var(--accent);font-weight:700}
    .scale-formula .scale-eq{color:var(--text-dim);margin:0 2px}
    .scale-deg{display:inline-flex;align-items:center}

    .empty-state{padding:30px 14px;text-align:center;color:var(--text-dim);font-size:var(--fs-small);line-height:1.6}
    .mode-tabs{display:flex;gap:6px;margin-bottom:10px;align-items:center}
    .mode-tab{background:var(--surface3);border:1px solid var(--border);color:var(--text-mid);font-family:var(--font);font-size:var(--fs-small);padding:5px 13px;border-radius:var(--radius-sm);cursor:pointer;transition:border-color var(--dur) var(--ease),color var(--dur) var(--ease),transform var(--dur-fast) var(--ease)}
    .mode-tab:hover{color:var(--text);transform:translateY(-1px)}
    .mode-tab.active{background:color-mix(in srgb,var(--accent) 14%,var(--surface3));border-color:var(--accent);color:var(--accent)}
    .palette-pane{margin-bottom:6px}
    .diat-chips{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
    .diat-chip{background:var(--bg-2);border:1px solid var(--border);border-left-width:3px;border-radius:var(--radius-sm);padding:7px 9px;cursor:pointer;text-align:left;color:var(--text);font-family:var(--font);transition:transform var(--dur-fast) var(--ease),filter var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease)}
    .diat-chip:hover{filter:brightness(1.3);transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.4)}
    .diat-chip:active{transform:translateY(0)}
    .diat-chip-row{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
    .diat-chip-roman{font-family:var(--font-mono);font-style:italic;font-weight:700;font-size:var(--fs-small);letter-spacing:.04em;color:var(--text-mid)}
    .diat-chip-name{font-family:var(--font-mono);font-size:15px;font-weight:700;color:var(--accent)}
    .diat-chip-notes{font-family:var(--font-mono);font-size:10px;color:var(--text-mid);margin-top:2px;letter-spacing:.02em}
  </style>
</head>
<body>

  <a href="index.html" class="back" data-i18n="back">← Herramientas</a>
  <h1 data-i18n="title">Interval Atlas</h1>
  <p class="subtitle" data-i18n="subtitle">Intervalos del mástil sobre su progresión, en todas las direcciones.</p>

  <div class="panel-layout" id="atlas-panel-layout">
    <div class="fretboard-wrap">
      <div class="progression-bar" id="atlas-bar"></div>

      <div class="row">
        <button class="btn primary" id="atlas-play" data-i18n="play">▶ Play</button>
        <button class="btn" id="atlas-prev">←</button>
        <button class="btn" id="atlas-next">→</button>
        <label>BPM <input type="number" id="atlas-bpm" value="80" min="40" max="220" style="width:60px"></label>
        <button class="btn" id="atlas-tap" data-i18n-attr="title:tap_t" title="Tap tempo (T): haga click al ritmo">TAP</button>
        <label data-i18n-attr="title:meter_t" title="Compás: clicks por barra antes de acentuar el 1"><span data-i18n="meter">Compás</span>
          <select id="atlas-bpc" style="width:64px">
            <option value="2">2/4</option>
            <option value="3">3/4</option>
            <option value="4" selected>4/4</option>
            <option value="5">5/4</option>
            <option value="6">6/8</option>
            <option value="7">7/8</option>
          </select>
        </label>
        <div id="atlas-beat-meter" class="beat-meter" data-i18n-attr="title:beatmeter_t" title="Posición en el compás"></div>
        <select id="atlas-direction">
          <option value="all" data-i18n="dir_all">Dirección: Todas</option>
          <option value="horizontal" data-i18n="dir_horizontal">Horizontal</option>
          <option value="vertical" data-i18n="dir_vertical">Vertical</option>
          <option value="diagonal" data-i18n="dir_diagonal">Diagonal</option>
        </select>
        <button class="btn" id="atlas-panel-show" type="button" data-i18n-attr="title:panelshow_t;aria-label:panelshow_aria" title="Mostrar editor de progresión" aria-label="Mostrar editor" data-i18n="panel_show">‹ Editor</button>
      </div>

      <details id="atlas-options-block" class="filters-block" open>
        <summary data-i18n="layers_summary">▾ Capas y opciones</summary>
        <div class="layer-toggles" style="margin-top:8px">
          <label class="layer-toggle"><input type="checkbox" id="atlas-l-chord" checked> <span data-i18n="layer_chord">Chord tones</span></label>
          <label class="layer-toggle"><input type="checkbox" id="atlas-l-approach"> <span data-i18n="layer_approach">Próximo acorde</span></label>
          <label class="layer-toggle"><input type="checkbox" id="atlas-l-all"> <span data-i18n="layer_all">Todas las 12</span></label>
          <label class="layer-toggle"><input type="checkbox" id="atlas-show-names"> <span data-i18n="layer_names">Nombres de nota</span></label>
          <span style="border-left:1px solid var(--border);height:18px;margin:0 6px"></span>
          <label class="layer-toggle" data-i18n-attr="title:preroll_t" title="Conteo previo de 4 clicks antes de empezar"><input type="checkbox" id="atlas-preroll"> <span data-i18n="preroll">Pre-roll</span></label>
          <label class="layer-toggle" data-i18n-attr="title:muteclick_t" title="Silenciar click del metrónomo"><input type="checkbox" id="atlas-mute-click"> <svg class="ico" viewBox="0 0 24 24" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M16 9l5 6M21 9l-5 6"/></svg> <span data-i18n="muteclick">Mute click</span></label>
        </div>
      </details>

      <details id="atlas-filters-block" class="filters-block">
        <summary data-i18n="filters_summary">▾ Filtros del mástil</summary>
        <div class="row" style="margin-top:8px">
          <label><span data-i18n="frets">Trastes</span>
            <input type="number" id="atlas-fret-min" value="0" min="0" max="22" style="width:48px">
            <span>–</span>
            <input type="number" id="atlas-fret-max" value="15" min="0" max="22" style="width:48px">
          </label>
          <label><span data-i18n="strings">Cuerdas</span>
            <input type="checkbox" id="atlas-s-1" data-string="1" checked>1
            <input type="checkbox" id="atlas-s-2" data-string="2" checked>2
