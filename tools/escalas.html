<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="page_title">Escalas — Entrenador</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    :root {
      /* Acento por herramienta: Escalas = verde */
      --accent: var(--c-escalas);
      --accent-dim: color-mix(in srgb, var(--accent) 16%, var(--bg-2));
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{padding:24px 12px 48px;min-height:100vh;}
    .back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--text-mid);font-family:var(--font-mono);font-size:var(--fs-micro);letter-spacing:.18em;text-transform:uppercase;margin-bottom:20px;transition:color var(--dur) var(--ease),transform var(--dur-fast) var(--ease);}
    .back:hover{color:var(--accent);transform:translateX(-2px);}
    .header{text-align:center;margin-bottom:24px;}
    .header-label{font-family:var(--font-mono);font-size:var(--fs-micro);letter-spacing:.34em;color:var(--text-dim);text-transform:uppercase;margin-bottom:8px;}
    .header h1{font-family:var(--font-display);font-size:var(--fs-h1);font-weight:700;letter-spacing:-0.01em;background:linear-gradient(165deg,#fff 8%,var(--accent) 58%,color-mix(in srgb,var(--accent) 55%,#000) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}

    /* Mode tabs */
    .tabs{display:flex;gap:8px;justify-content:center;margin-bottom:24px;flex-wrap:wrap;}
    .tab{padding:9px 20px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);color:var(--text-mid);font-family:var(--font);font-size:var(--fs-small);font-weight:700;cursor:pointer;transition:border-color var(--dur) var(--ease),color var(--dur) var(--ease),transform var(--dur-fast) var(--ease),box-shadow var(--dur) var(--ease);letter-spacing:.03em;}
    .tab:hover{border-color:var(--border2);color:var(--text);transform:translateY(-1px);}
    .tab.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent),0 6px 18px var(--glow);}

    /* Scale selector */
    .scale-section{max-width:720px;margin:0 auto 18px;}
    .section-label{font-family:var(--font-mono);font-size:var(--fs-micro);letter-spacing:.22em;color:var(--text-dim);text-transform:uppercase;margin-bottom:10px;}
    .scale-grid{display:flex;flex-wrap:wrap;gap:8px;}
    .scale-btn{
      padding:9px 15px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);
      color:var(--text-mid);font-family:var(--font);font-size:var(--fs-small);font-weight:700;cursor:pointer;text-align:left;
      transition:border-color var(--dur) var(--ease),color var(--dur) var(--ease),transform var(--dur-fast) var(--ease),box-shadow var(--dur) var(--ease);
    }
    .scale-btn:hover{border-color:var(--border2);color:var(--text);transform:translateY(-2px);box-shadow:var(--shadow-1);}
    .scale-btn.active{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 28%,transparent),0 6px 16px var(--glow);}
    .scale-btn .scale-sub{font-family:var(--font-mono);font-size:var(--fs-micro);font-weight:500;opacity:.72;display:block;margin-top:3px;letter-spacing:.02em;}

    /* Position nav */
    .pos-nav{display:flex;gap:7px;align-items:center;justify-content:center;margin:0 auto 16px;flex-wrap:wrap;}
    .pos-btn{padding:6px 13px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text-mid);font-family:var(--font-mono);font-size:var(--fs-micro);cursor:pointer;transition:border-color var(--dur) var(--ease),color var(--dur) var(--ease),transform var(--dur-fast) var(--ease);}
    .pos-btn:hover{border-color:var(--border2);color:var(--text);transform:translateY(-1px);}
    .pos-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);box-shadow:0 4px 12px var(--glow);}
    .pos-label{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--text-dim);letter-spacing:.06em;}

    /* Legend */
    .legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}
    .legend-item{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--text-mid);letter-spacing:.02em;}
    .legend-dot{width:12px;height:12px;border-radius:50%;}

    /* Fretboard */
    .fretboard-wrap{overflow-x:auto;padding:14px 0 12px;}
    .fretboard-inner{min-width:640px;max-width:900px;margin:0 auto;background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-1);padding:14px 16px;}
    svg#fretboard{width:100%;display:block;}

    /* Quiz panel */
    .quiz-panel{max-width:480px;margin:18px auto;background:linear-gradient(180deg,var(--surface3),var(--surface2));border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-1);padding:24px;}
    .quiz-question{text-align:center;font-size:var(--fs-body);color:var(--text);margin-bottom:18px;line-height:1.5;}
    .quiz-question strong{color:var(--accent);font-family:var(--font-mono);}
    .quiz-options{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
    .quiz-opt{padding:11px 22px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface);color:var(--text-mid);font-family:var(--font-mono);font-size:var(--fs-small);font-weight:700;cursor:pointer;transition:border-color var(--dur) var(--ease),color var(--dur) var(--ease),transform var(--dur-fast) var(--ease),box-shadow var(--dur) var(--ease);}
    .quiz-opt:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--border2));color:var(--text);transform:translateY(-2px);box-shadow:var(--shadow-1);}
    .quiz-opt.correct{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent),0 6px 16px var(--glow);}
    .quiz-opt.wrong{border-color:#e74c3c;background:color-mix(in srgb,#e74c3c 16%,var(--bg-2));color:#e74c3c;}
    .quiz-feedback{text-align:center;margin-top:16px;font-size:var(--fs-small);min-height:20px;}
    .quiz-next{margin-top:14px;display:block;width:100%;padding:11px;border-radius:var(--radius-sm);border:1px solid var(--accent);background:var(--accent-dim);color:var(--accent);font-family:var(--font);font-size:var(--fs-small);font-weight:700;cursor:pointer;transition:background var(--dur) var(--ease),color var(--dur) var(--ease),transform var(--dur-fast) var(--ease);}
    .quiz-next:hover{background:var(--accent);color:#04150b;transform:translateY(-1px);}
    .quiz-score{text-align:center;font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--text-dim);margin-top:12px;letter-spacing:.1em;}

    /* Scale description */
    .scale-info{max-width:480px;margin:14px auto;background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-1);padding:16px 20px;}
    .scale-info-name{font-family:var(--font-display);font-size:var(--fs-h2);font-weight:700;letter-spacing:-0.01em;color:var(--accent);margin-bottom:7px;}
    .scale-info-desc{font-size:var(--fs-small);color:var(--text-mid);line-height:1.62;}
    .scale-info-notes{margin-top:10px;font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--text-dim);letter-spacing:.08em;}

    /* Calc mode */
    .calc-panel{max-width:720px;margin:0 auto 14px;}
    .calc-type-row{display:flex;gap:8px;justify-content:center;margin-bottom:12px;}
    .calc-type-btn{padding:9px 17px;border-radius:999px;border:1px solid var(--border2);background:var(--surface2);color:var(--text-mid);font-family:var(--font);font-size:var(--fs-small);font-weight:700;cursor:pointer;transition:border-color var(--dur) var(--ease),color var(--dur) var(--ease),transform var(--dur-fast) var(--ease);}
    .calc-type-btn:hover{transform:translateY(-1px);color:var(--text);}
    .calc-type-btn.major.active{border-color:#d4a847;background:#d4a84722;color:#d4a847;}
    .calc-type-btn.pmajor.active{border-color:#e67e22;background:#e67e2222;color:#e67e22;}
    .calc-type-btn.minor.active{border-color:#8e44ad;background:#8e44ad22;color:#c39bd3;}
    .calc-type-btn.pminor.active{border-color:#e91e8c;background:#e91e8c22;color:#e91e8c;}
    .calc-penta-badge{display:inline-block;font-family:var(--font-mono);font-size:var(--fs-micro);padding:2px 8px;border-radius:999px;background:var(--surface3);color:var(--text-mid);margin-left:6px;letter-spacing:.05em;}
    .diag-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:0 2px;}
    .diag-label{font-size:var(--fs-small);color:var(--text-mid);letter-spacing:.05em;}
    .ios-toggle{position:relative;display:inline-block;width:46px;height:26px;flex-shrink:0;}
    .ios-toggle input{opacity:0;width:0;height:0;position:absolute;}
    .ios-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--surface3);border:1px solid var(--border2);border-radius:26px;transition:background var(--dur) var(--ease);}
    .ios-slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:var(--text-mid);border-radius:50%;transition:transform var(--dur) var(--ease),background var(--dur) var(--ease);}
    .ios-toggle input:checked + .ios-slider{background:var(--accent);border-color:var(--accent);}
    .ios-toggle input:checked + .ios-slider:before{transform:translateX(20px);background:#04150b;}
    .ios-toggle input:disabled + .ios-slider{opacity:.35;cursor:default;}
    .calc-formula-box{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-1);padding:14px 18px;margin-bottom:12px;}
    .calc-formula-label{font-family:var(--font-mono);font-size:var(--fs-micro);letter-spacing:.2em;color:var(--text-dim);text-transform:uppercase;margin-bottom:10px;}
    .calc-formula-steps{display:flex;align-items:center;flex-wrap:wrap;gap:0;font-size:var(--fs-small);font-family:var(--font-mono);}
    .calc-step-note{padding:5px 9px;border-radius:var(--radius-sm);font-weight:700;font-size:var(--fs-small);font-family:var(--font-mono);background:var(--bg-2);border:1px solid var(--border2);}
    .calc-step-note.root-note{border-color:var(--calc-color,var(--accent));color:var(--calc-color,var(--accent));box-shadow:0 0 10px color-mix(in srgb,var(--calc-color,var(--accent)) 35%,transparent);}
    .calc-step-sep{padding:2px 5px;color:var(--text-dim);font-size:var(--fs-micro);font-weight:700;}
    .calc-step-sep.T{color:var(--text-mid);}
    .calc-step-sep.S{color:#e74c3c88;}
    .calc-hint{text-align:center;padding:11px;font-family:var(--font-mono);font-size:var(--fs-small);color:var(--text-mid);background:var(--bg-2);border-radius:var(--radius-sm);border:1px dashed var(--border2);}
    .calc-result-notes{margin-top:10px;font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--text-dim);letter-spacing:.06em;text-align:center;}
    .calc-mode-active #fretboard{cursor:crosshair;}

    /* Editor mode */
    .editor-panel{max-width:720px;margin:0 auto 14px;background:linear-gradient(180deg,var(--surface3),var(--surface2));border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-1);padding:18px 20px;}
    .editor-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;}
    .editor-label{font-family:var(--font-mono);font-size:var(--fs-micro);letter-spacing:.15em;color:var(--text-dim);text-transform:uppercase;min-width:70px;}
    .editor-select{background:var(--surface);border:1px solid var(--border2);color:var(--text);border-radius:var(--radius-sm);padding:7px 11px;font-family:var(--font);font-size:var(--fs-small);cursor:pointer;}
    .deg-btn{width:34px;height:34px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface);color:var(--text-mid);font-family:var(--font-mono);font-size:var(--fs-small);font-weight:700;cursor:pointer;transition:border-color var(--dur) var(--ease),color var(--dur) var(--ease),transform var(--dur-fast) var(--ease);}
    .deg-btn:hover{transform:translateY(-1px);color:var(--text);}
    .deg-btn.active{background:color-mix(in srgb,var(--edit-color,var(--accent)) 16%,var(--surface));border-color:var(--edit-color,var(--accent));color:var(--edit-color,var(--accent));box-shadow:0 4px 12px color-mix(in srgb,var(--edit-color,var(--accent)) 28%,transparent);}
    .editor-hint{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--text-mid);padding:9px 13px;background:var(--bg-2);border-radius:var(--radius-sm);border-left:3px solid var(--accent);}
    .editor-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
    .btn-save{padding:9px 19px;border-radius:var(--radius-sm);border:1px solid var(--accent);background:var(--accent-dim);color:var(--accent);font-family:var(--font);font-size:var(--fs-small);font-weight:700;cursor:pointer;transition:background var(--dur) var(--ease),color var(--dur) var(--ease),transform var(--dur-fast) var(--ease);}
    .btn-save:hover{background:var(--accent);color:#04150b;transform:translateY(-1px);}
    .btn-clear{padding:9px 19px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface);color:var(--text-mid);font-family:var(--font);font-size:var(--fs-small);font-weight:700;cursor:pointer;transition:border-color var(--dur) var(--ease),color var(--dur) var(--ease),transform var(--dur-fast) var(--ease);}
    .btn-clear:hover{border-color:#e74c3c;color:#e74c3c;transform:translateY(-1px);}
    .btn-reset{padding:9px 19px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-2);color:var(--text-dim);font-family:var(--font-mono);font-size:var(--fs-micro);cursor:pointer;transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease);}
    .btn-reset:hover{color:var(--text);border-color:var(--border2);}
    .edit-mode-active #fretboard{cursor:crosshair;}
    .editor-saved{color:var(--accent);font-family:var(--font-mono);font-size:var(--fs-micro);margin-left:8px;opacity:0;transition:opacity var(--dur) var(--ease);}
    .editor-saved.show{opacity:1;}

    /* Modes section */
    .calc-modes-section{margin-top:12px;}
    .calc-modes-header{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
    .calc-modes-label{font-family:var(--font-mono);font-size:var(--fs-micro);letter-spacing:.2em;color:var(--text-dim);text-transform:uppercase;}
    .mode-view-toggle{display:flex;gap:4px;margin-left:auto;}
    .mode-view-btn{padding:5px 11px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text-mid);font-size:var(--fs-micro);font-weight:700;cursor:pointer;transition:border-color var(--dur) var(--ease),color var(--dur) var(--ease);font-family:var(--font);letter-spacing:.03em;}
    .mode-view-btn:hover{border-color:var(--border2);color:var(--text);}
    .mode-view-btn.active{border-color:var(--text-mid);color:var(--text);}
    .calc-modes-row{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;}
    .calc-mode-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 11px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);cursor:pointer;transition:border-color var(--dur) var(--ease),transform var(--dur-fast) var(--ease),box-shadow var(--dur) var(--ease);min-width:64px;text-align:center;font-family:var(--font);}
    .calc-mode-btn:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:var(--shadow-1);}
    .calc-mode-btn.active{border-color:var(--mode-color);box-shadow:0 0 0 1px color-mix(in srgb,var(--mode-color) 30%,transparent),0 6px 14px color-mix(in srgb,var(--mode-color) 28%,transparent);}
    .mode-degree{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--text-dim);}
    .calc-mode-btn.active .mode-degree{color:var(--mode-color);}
    .mode-note{font-family:var(--font-mono);font-size:18px;font-weight:700;color:var(--text-mid);}
    .calc-mode-btn.active .mode-note{color:var(--mode-color);}
    .mode-name{font-size:var(--fs-micro);font-weight:700;color:var(--text-dim);}
    .calc-mode-btn.active .mode-name{color:var(--mode-color);}
    .mode-sound{font-size:9px;color:var(--text-dim);margin-top:1px;}
    .calc-mode-btn.active .mode-sound{color:var(--text-mid);}

    /* Metronome */
    .metro-bar{display:flex;align-items:center;gap:10px 14px;justify-content:center;flex-wrap:wrap;margin:14px auto 0;max-width:620px;padding:14px 20px;background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-1);}
    .metro-btn{padding:7px 15px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface);color:var(--text-mid);font-family:var(--font);font-size:var(--fs-micro);font-weight:700;cursor:pointer;transition:border-color var(--dur) var(--ease),color var(--dur) var(--ease),transform var(--dur-fast) var(--ease);}
    .metro-btn:hover{color:var(--text);border-color:var(--border2);transform:translateY(-1px);}
    .metro-btn.metro-on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);box-shadow:0 4px 12px var(--glow);}
    .metro-bpm-row{display:flex;align-items:center;gap:5px;}
    .metro-bpm-btn{padding:5px 9px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-2);color:var(--text-mid);font-family:var(--font-mono);font-size:var(--fs-small);font-weight:700;cursor:pointer;transition:color var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease);}
    .metro-bpm-btn:hover{color:var(--text);border-color:var(--border2);}
    .metro-bpm-btn.tap-pulse{transform:scale(1.14);border-color:var(--gold);color:var(--gold);}
    .metro-bpm-input{width:54px;font-size:16px;font-weight:700;color:var(--gold);text-align:center;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 2px;font-family:var(--font-mono);}
    .metro-bpm-input::-webkit-inner-spin-button,.metro-bpm-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
    .metro-lbl{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--text-dim);letter-spacing:.06em;display:inline-flex;align-items:center;gap:5px;}
    .metro-sel{background:var(--bg-2);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:var(--fs-micro);padding:5px 7px;border-radius:var(--radius-sm);cursor:pointer;}
    .metro-viz{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%;}
    .metro-beats{display:flex;gap:9px;align-items:center;}
    .metro-beat-dot{width:13px;height:13px;border-radius:50%;background:var(--surface3);border:1px solid var(--border2);transition:background .05s,box-shadow .05s,transform .05s;}
    .metro-beat-dot.downbeat{border-color:color-mix(in srgb,var(--gold) 40%,var(--border2));}
    .metro-beat-dot.on{background:var(--accent);box-shadow:0 0 8px var(--accent);transform:scale(1.15);}
    .metro-beat-dot.downbeat.on{background:var(--gold);box-shadow:0 0 9px var(--gold);}
    .metro-subs{display:flex;gap:6px;align-items:center;min-height:8px;}
    .metro-sub-pip{width:6px;height:6px;border-radius:50%;background:var(--surface3);transition:background .04s,box-shadow .04s;}
    .metro-sub-pip.on{background:var(--text-mid);box-shadow:0 0 5px var(--text-mid);}
    .metro-sub-pip:first-child.on{background:var(--accent);box-shadow:0 0 5px var(--accent);}

    footer{text-align:center;margin-top:32px;font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--text-dim);letter-spacing:.12em;}
    footer a{color:var(--text-mid);text-decoration:none;transition:color var(--dur) var(--ease);}
    footer a:hover{color:var(--accent);}
  </style>
</head>
<body>

<a href="index.html" class="back"><span data-i18n="back_tools">← Herramientas</span></a>

<div class="header">
  <div class="header-label" data-i18n="header_label">Escalas</div>
  <h1 data-i18n="header_title">Escalas</h1>
</div>

<div class="tabs">
  <button class="tab active" data-mode="calc"><svg class="ico" viewBox="0 0 24 24" stroke-width="1.7" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 4v16"/></svg> <span data-i18n="tab_calc">Calcular</span></button>
  <button class="tab" data-mode="quiz"><svg class="ico" viewBox="0 0 24 24" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/></svg> <span data-i18n="tab_quiz">Quiz</span></button>

const FORMULAS = {
  major:  { steps: [2,2,1,2,2,2,1], label: 'Mayor Natural',     color: '#d4a847', isPenta: false },
  pmajor: { steps: [2,2,3,2,3],     label: 'Pentatónica Mayor', color: '#e67e22', isPenta: true, removedDegrees: '4° y 7°' },

function buildScaleNotes(rootNote, formula){
  const idx = CHROMATIC.indexOf(rootNote);
  const notes = [rootNote];
  let cur = idx;
  formula.steps.forEach(step=>{ cur=(cur+step)%12; notes.push(CHROMATIC[cur]); });
  return notes.slice(0, formula.steps.length);
}

function allPositionsOfNotes(scaleNotes){
  const positions=[];
  for(let si=0;si<6;si++){
    for(let fret=0;fret<=12;fret++){
      const note=noteAt(OPEN_NOTES[si],fret);
      const di=scaleNotes.indexOf(note);
      if(di>=0) positions.push({si,fret,d:di+1});
    }
  }
  return positions;
}

// ─── Custom scale overrides (localStorage) ───────────────────────────
function loadCustomScales(){
  try{
    const raw=localStorage.getItem('maru_escalas_custom');
    if(!raw) return;
    const overrides=JSON.parse(raw);
    Object.entries(overrides).forEach(([id,data])=>{
      if(SCALES[id]) SCALES[id].positions=data.positions;
    });
  }catch(e){}
}

function saveCustomScales(){
  try{
    const raw=localStorage.getItem('maru_escalas_custom');
    const overrides=raw?JSON.parse(raw):{};
    overrides[state.editScaleId]={positions:SCALES[state.editScaleId].positions.slice()};
    localStorage.setItem('maru_escalas_custom',JSON.stringify(overrides));
  }catch(e){}
}

function resetCustomScale(id){
  try{
    const raw=localStorage.getItem('maru_escalas_custom');
    if(!raw) return;
    const overrides=JSON.parse(raw);
    delete overrides[id];
    localStorage.setItem('maru_escalas_custom',JSON.stringify(overrides));
  }catch(e){}
}

// ─── SVG Fretboard ────────────────────────────────────────────────────
const SVG_W=920,SVG_H=220,NUT_X=48,RIGHT_X=SVG_W-16;
const FRET_W=(RIGHT_X-NUT_X)/12;
const STRING_TOP=28,STRING_BOT=SVG_H-28;
const STRING_GAP=(STRING_BOT-STRING_TOP)/5;

function fretX(fret){ return fret===0?NUT_X-4:NUT_X+(fret-0.5)*FRET_W; }
function stringY(si){ return STRING_BOT-si*STRING_GAP; }

function initFretboard(){
  const svg=document.getElementById('fretboard'); svg.innerHTML='';
  const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML='<filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>';
  svg.appendChild(defs);
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  // Nut
  const nut=document.createElementNS('http://www.w3.org/2000/svg','rect');
  nut.setAttribute('x',NUT_X-5);nut.setAttribute('y',STRING_TOP-8);
  nut.setAttribute('width',5);nut.setAttribute('height',STRING_GAP*5+16);
  nut.setAttribute('fill','#5a4820');g.appendChild(nut);
  // Frets
  for(let f=1;f<=12;f++){
    const x=NUT_X+f*FRET_W;
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',x);l.setAttribute('y1',STRING_TOP-6);l.setAttribute('x2',x);l.setAttribute('y2',STRING_BOT+6);
    l.setAttribute('stroke','#1a1a1a');l.setAttribute('stroke-width','2');g.appendChild(l);
  }
  // Fret numbers
  for(let f=0;f<=12;f++){
    const x=f===0?NUT_X-18:NUT_X+(f-0.5)*FRET_W;
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',x);t.setAttribute('y',14);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','10');
    t.setAttribute('fill',FRET_MARKERS.includes(f)?'#d4a847':'#2a2a2a');t.setAttribute('font-family','JetBrains Mono, monospace');
    t.textContent=f===0?'○':f;g.appendChild(t);
  }
  // Strings
  OPEN_NOTES.forEach((_,si)=>{
    const y=stringY(si);
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',NUT_X-4);l.setAttribute('y1',y);l.setAttribute('x2',RIGHT_X);l.setAttribute('y2',y);
    l.setAttribute('stroke','#3a2a10');l.setAttribute('stroke-width',STRING_THICK[si]);g.appendChild(l);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',22);t.setAttribute('y',y+4);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','11');
    t.setAttribute('font-style','italic');t.setAttribute('font-weight','700');t.setAttribute('fill','#444');t.setAttribute('font-family','JetBrains Mono, monospace');
    t.textContent=STRING_LABELS[si];g.appendChild(t);
  });
  // Position markers
  FRET_MARKERS.forEach(f=>{
    if(f===12){
      [1,3].forEach(si=>{const c=makeDot(NUT_X+(f-0.5)*FRET_W,stringY(si)-STRING_GAP*.5,4,'#1e1e1e');g.appendChild(c);});
    }else{
      g.appendChild(makeDot(NUT_X+(f-0.5)*FRET_W,stringY(2)-STRING_GAP*.5,4,'#1e1e1e'));
    }
  });
  svg.appendChild(g);
  const dotsG=document.createElementNS('http://www.w3.org/2000/svg','g');
  dotsG.id='fb-dots';svg.appendChild(dotsG);
}

function makeDot(cx,cy,r,fill){
  const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('cx',cx);c.setAttribute('cy',cy);c.setAttribute('r',r);c.setAttribute('fill',fill);return c;
}

function DEGREE_COLORS(scale){
  return {
    1: scale.color,        // root — full color
    2: scale.color+'99',
    3: scale.color+'99',
    4: scale.color+'99',
    5: scale.color+'99',
    6: scale.color+'99',
    7: scale.color+'99',
  };
}

function renderDots(){
  const dotsG=document.getElementById('fb-dots'); dotsG.innerHTML='';
  if(!state.selectedScale) return;
  const scale=SCALES[state.selectedScale];
  const positions=scale.positions;
  const pos=positions[state.positionIdx]||positions[0];
  const dc=DEGREE_COLORS(scale);

  // For connect mode — show both positions with different opacity
  if(state.mode==='connect' && positions.length>1){
    const otherIdx=(state.positionIdx+1)%positions.length;
    const other=positions[otherIdx];
    other.forEach(p=>{
      const cx=fretX(p.fret),cy=stringY(p.si);
      const c=makeDot(cx,cy,11,scale.color+'33');
      dotsG.appendChild(c);
      // Dashed circle
      const ring=document.createElementNS('http://www.w3.org/2000/svg','circle');
      ring.setAttribute('cx',cx);ring.setAttribute('cy',cy);ring.setAttribute('r',13);
      ring.setAttribute('fill','none');ring.setAttribute('stroke',scale.color+'55');ring.setAttribute('stroke-width','1.5');
      ring.setAttribute('stroke-dasharray','3,3');dotsG.appendChild(ring);
    });
  }

  pos.forEach(p=>{
    const cx=fretX(p.fret),cy=stringY(p.si);
    const isRoot=p.d===1;
    const col=dc[p.d];
    const r=isRoot?14:11;
    const c=makeDot(cx,cy,r,col);
    if(isRoot) c.setAttribute('filter','url(#glow)');
    dotsG.appendChild(c);
    // Label
    const noteName=noteAt(OPEN_NOTES[p.si],p.fret);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',cx);t.setAttribute('y',cy+4);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','9');
    t.setAttribute('font-weight','800');t.setAttribute('fill',isRoot?'#fff':'#000');t.setAttribute('font-family','JetBrains Mono, monospace');
    t.textContent=noteName;dotsG.appendChild(t);

    // Slide indicator
    if(p.slide){
      const sl=document.createElementNS('http://www.w3.org/2000/svg','text');
      sl.setAttribute('x',cx+16);sl.setAttribute('y',cy-10);sl.setAttribute('font-size','9');
      sl.setAttribute('fill',scale.color+'99');sl.setAttribute('font-family','JetBrains Mono, monospace');
      sl.textContent='slide↗';dotsG.appendChild(sl);
    }
  });
}

  const leg=document.getElementById('legend');

  const scale=SCALES[state.selectedScale];
  leg.style.display='flex';
  leg.innerHTML=`
    <div class="legend-item">
      <div class="legend-dot" style="background:${scale.color};box-shadow:0 0 6px ${scale.color}55;"></div>
      ${I18N.t('legend_root')} (${scale.root})
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:${scale.color}88;"></div>
      ${I18N.t('legend_other')}
    </div>
    ${state.mode==='connect'&&scale.positions.length>1?`<div class="legend-item"><div class="legend-dot" style="background:${scale.color}22;border:1px dashed ${scale.color}55;"></div>${I18N.t('legend_adjacent')}</div>`:''}
  `;
}

function renderPosNav(){
  const nav=document.getElementById('pos-nav');
  if(!state.selectedScale){nav.style.display='none';return;}
  const scale=SCALES[state.selectedScale];
  if(scale.positions.length<=1&&state.mode==='visual'){nav.style.display='none';return;}
  nav.style.display='flex';
  nav.innerHTML=`<span class="pos-label">${I18N.t('pos_label')}:</span>`+
    scale.positions.map((_,i)=>
      `<button class="pos-btn ${state.positionIdx===i?'active':''}" data-pos="${i}">${I18N.t('pos_abbr')} ${i+1}</button>`
    ).join('')+
    (state.mode==='connect'?`<span class="pos-label">${I18N.t('pos_connected')}</span>`:'');
  nav.querySelectorAll('[data-pos]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      state.positionIdx=parseInt(btn.dataset.pos);
      renderPosNav();renderDots();
    });
  });
}

function renderScaleInfo(){
  const info=document.getElementById('scale-info');
  if(!state.selectedScale||state.mode==='quiz'){info.style.display='none';return;}
  const scale=SCALES[state.selectedScale];
  info.style.display='block';
  info.innerHTML=`
    <div class="scale-info-name" style="color:${scale.color}">${scaleText(state.selectedScale,'name')}</div>
    <div class="scale-info-desc">${scaleText(state.selectedScale,'desc')}</div>
    <div class="scale-info-notes">${I18N.t('lbl_notas')}: ${scale.notes.join(' — ')}</div>
  `;
}

// Devuelve el texto traducido (name/sub/desc) de una escala por su id,
// con fallback al valor original en el objeto de datos.
function scaleText(id, field){
  const k='scale_'+id+'_'+field;
  const v=I18N.t(k);
  return v===k ? (SCALES[id] ? SCALES[id][field] : k) : v;
}
// Texto traducido de una fórmula (label/removedDegrees) por su tipo.
function formulaText(type, field){
  const k='formula_'+type+'_'+field;
  const v=I18N.t(k);
  return v===k ? (FORMULAS[type] ? FORMULAS[type][field] : k) : v;
}
// Texto traducido de un modo (name/sound) por su índice.
function modeText(idx, field){
  const k='mode_'+idx+'_'+field;
  const v=I18N.t(k);
  return v===k ? (MODES[idx] ? MODES[idx][field] : k) : v;
}

// ─── Quiz ─────────────────────────────────────────────────────────────
function generateQuiz(){
  // Determine which positions to quiz from: hardcoded scale OR calc positions
  let pos = null;
  if(state.selectedScale && SCALES[state.selectedScale]){
    pos = SCALES[state.selectedScale].positions[0];
  } else if(state.calcRoot && state.calcPositions && state.calcPositions.length){
    pos = state.calcPositions;
  }
  if(!pos){
    document.getElementById('quiz-panel').innerHTML=`<p style="text-align:center;color:var(--text-dim);font-size:12px;">${I18N.t('quiz_empty')}</p>`;
    document.getElementById('quiz-panel').style.display='block';
    return;
  }
  // Pick a random note from the scale
  const item=pos[Math.floor(Math.random()*pos.length)];
  const correctNote=noteAt(OPEN_NOTES[item.si],item.fret);
  const strLabel=STRING_LABELS[item.si];
  state.quizAnswer=null;
  state.quizCorrectNote=correctNote;

  // Wrong answers from chromatic
  const options=new Set([correctNote]);
  while(options.size<4){
    options.add(CHROMATIC[Math.floor(Math.random()*12)]);
  }
  const shuffled=[...options].sort(()=>Math.random()-.5);

  const panel=document.getElementById('quiz-panel');
  panel.style.display='block';
  const fretLabel=item.fret===0?('0 ('+I18N.t('quiz_open')+')'):item.fret;
  panel.innerHTML=`
    <div class="quiz-question">
      ${I18N.t('quiz_q_pre')} <strong>${fretLabel}</strong> ${I18N.t('quiz_q_mid')} <strong>${strLabel}</strong>?
    </div>
    <div class="quiz-options">
      ${shuffled.map(n=>`<button class="quiz-opt" data-note="${n}">${n}</button>`).join('')}
    </div>
    <div class="quiz-feedback" id="quiz-feedback"></div>
    <div class="quiz-score">${I18N.t('quiz_score')}: ${state.quizScore} / ${state.quizTotal}</div>
  `;
  panel.querySelectorAll('.quiz-opt').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(state.quizAnswer!==null)return;
      state.quizAnswer=btn.dataset.note;
      state.quizTotal++;
      const correct=btn.dataset.note===correctNote;
      if(correct)state.quizScore++;
      btn.classList.add(correct?'correct':'wrong');
      if(!correct){
        panel.querySelector(`[data-note="${correctNote}"]`)?.classList.add('correct');
      }
      document.getElementById('quiz-feedback').innerHTML=
        correct?`<span style="color:var(--accent)">${I18N.t('quiz_correct')}</span>`:`<span style="color:#e74c3c">${I18N.t('quiz_wrong')} ${correctNote}</span>`;
      document.getElementById('quiz-feedback').insertAdjacentHTML('afterend',
        `<button class="quiz-next" id="quiz-next-btn">${I18N.t('quiz_next')}</button>`);
      document.getElementById('quiz-next-btn')?.addEventListener('click',generateQuiz);
    });
  });
}

// ─── Calc mode ───────────────────────────────────────────────────────
function stepLabel(s){ return s===1?I18N.t('step_half'): s===2?I18N.t('step_whole'):'m3'; }

function buildDiagonalPath(scaleNotes){
  const BASE = [0,5,10,15,19,24]; // semitones from low E: E A D G B e
  const allPos = allPositionsOfNotes(scaleNotes)
    .filter(p => p.fret >= 1)
    .map(p => ({...p, pitch: BASE[p.si] + p.fret}));

  if(!allPos.length) return [];

  const n = scaleNotes.length;
  const perString = new Map();
  const used = new Set();
  const key = p => `${p.si},${p.fret}`;

  // Nodo inicial: menor fret < 5 en la cuerda más grave posible
  const early = allPos.filter(p => p.fret < 5).sort((a,b) => a.si-b.si || a.fret-b.fret);
  const start = early[0] || allPos.sort((a,b) => a.pitch-b.pitch)[0];

  const path = [{...start, pathSlide: false}];
  used.add(key(start));
  perString.set(start.si, 1);
  let lastPitch = start.pitch;
  let lastSi    = start.si;
  let lastFret  = start.fret;
  let deg = start.d;

  for(let step = 0; step < n * 6; step++){
    deg = (deg % n) + 1; // siguiente grado consecutivo, sin saltarse ninguno

    const valid = p => p.d===deg && p.pitch>lastPitch && !used.has(key(p)) && (perString.get(p.si)||0)<3;

    // Candidatos en la misma cuerda y en la cuerda siguiente
    const sameCand = allPos.filter(p => p.si===lastSi   && valid(p))
                           .sort((a,b) => Math.abs(a.fret-lastFret) - Math.abs(b.fret-lastFret));
    const nextCand = allPos.filter(p => p.si===lastSi+1 && valid(p))
                           .sort((a,b) => Math.abs(a.fret-lastFret) - Math.abs(b.fret-lastFret));

    let chosen;
    if(sameCand.length && nextCand.length){
      const dSame = Math.abs(sameCand[0].fret - lastFret);
      const dNext = Math.abs(nextCand[0].fret - lastFret);
      // Preferir misma cuerda si empatan o es más cercana; subir cuerda solo si es estrictamente más cerca
      chosen = dNext < dSame ? nextCand[0] : sameCand[0];
    } else if(sameCand.length){
      chosen = sameCand[0];
    } else if(nextCand.length){
      chosen = nextCand[0];
    } else {
      // Fallback: cualquier candidato de pitch más bajo
      const any = allPos.filter(valid).sort((a,b) => a.pitch-b.pitch);
      if(!any.length) break;
      chosen = any[0];
    }

    path.push({...chosen, pathSlide: chosen.si !== lastSi});
    used.add(key(chosen));
    perString.set(chosen.si, (perString.get(chosen.si)||0)+1);
    lastPitch = chosen.pitch;
    lastSi    = chosen.si;
    lastFret  = chosen.fret;
  }
  return path;
}

function renderCalcPanel(){
  const panel=document.getElementById('calc-panel');
  if(state.mode!=='calc'){panel.style.display='none';document.querySelector('.fretboard-inner').classList.remove('calc-mode-active');return;}
  panel.style.display='block';
  document.querySelector('.fretboard-inner').classList.add('calc-mode-active');

  const formula=FORMULAS[state.calcType];

  // Mode support: only for major scale
  const activeMode=(state.calcType==='major')?MODES[state.calcModeIdx]:null;
  const displayColor=activeMode?activeMode.color:formula.color;
  const displaySteps=activeMode?activeMode.steps:formula.steps;

  let majorScaleNotes=null, displayNotes=null, formulaHTML='';
  if(state.calcRoot){
    majorScaleNotes=buildScaleNotes(state.calcRoot.note, formula);
    if(activeMode&&state.calcModeIdx>0){
      displayNotes=state.calcModeFromRoot
        ?buildScaleNotes(state.calcRoot.note,activeMode)
        :[...majorScaleNotes.slice(state.calcModeIdx),...majorScaleNotes.slice(0,state.calcModeIdx)];
    } else {
      displayNotes=majorScaleNotes;
    }
    const notesRow=[...displayNotes, displayNotes[0]];
    formulaHTML=notesRow.map((n,i)=>{
      const noteEl=`<span class="calc-step-note${i===0?' root-note':''}" style="--calc-color:${displayColor}">${n}</span>`;
      if(i<displaySteps.length){
        const lbl=stepLabel(displaySteps[i]);
        return noteEl+`<span class="calc-step-sep" style="color:${displayColor}88;font-size:10px;padding:0 4px;">${lbl}</span>`;
      }
      return noteEl;
    }).join('');
  } else {
    formulaHTML=formula.steps.map(s=>{
      const lbl=stepLabel(s);
      return `<span class="calc-step-sep" style="font-size:13px;padding:4px 8px;background:#111;border-radius:4px;border:1px solid #222;color:${formula.color}99;">${lbl}</span>`;
    }).join('<span style="color:#333;padding:0 2px;">—</span>');
  }

  const formulaLabel=(activeMode&&state.calcModeIdx>0)
    ?(displayNotes?`${displayNotes[0]} ${modeText(state.calcModeIdx,'name')}`:modeText(state.calcModeIdx,'name'))+` · ${modeText(state.calcModeIdx,'sound')}`
    :formulaText(state.calcType,'label');

  const pentaNote=formula.isPenta
    ? `<div style="font-size:11px;color:#666;margin-top:6px;">${I18N.t('calc_penta_pre')} ${formulaText(state.calcType,'removedDegrees')} · ${formula.steps.length} ${I18N.t('lbl_notas_low')}</div>`
    : '';

  const diagBtn=formula.isPenta?`
      <label class="ios-toggle" style="margin-left:auto;" title="${I18N.t('calc_diagonal_t')}">
        <input type="checkbox" id="calc-diagonal-toggle" ${state.calcDiagonal?'checked':''} ${!state.calcRoot?'disabled':''}>
        <span class="ios-slider"></span>
      </label>`:'';

  const modeViewToggle=(state.calcModeIdx>0&&majorScaleNotes)?`
    <div class="mode-view-toggle">
      <button class="mode-view-btn${!state.calcModeFromRoot?' active':''}" data-from-root="0">${I18N.t('calc_in_key')}</button>
      <button class="mode-view-btn${state.calcModeFromRoot?' active':''}" data-from-root="1">${activeMode?modeText(state.calcModeIdx,'name'):''} ${I18N.t('calc_from')} ${state.calcRoot.note}</button>
    </div>
  `:'';

  const modesSection=(state.calcType==='major'&&majorScaleNotes)?`
    <div class="calc-modes-section">
      <div class="calc-modes-header">
        <div class="calc-modes-label">${I18N.t('calc_modes_of')} ${state.calcRoot.note} ${I18N.t('calc_major_word')}</div>
        ${modeViewToggle}
      </div>
      <div class="calc-modes-row">
        ${MODES.map((m,i)=>{
          const modeRoot=majorScaleNotes[m.degreeOffset];
          const isActive=state.calcModeIdx===i;
          return `<button class="calc-mode-btn${isActive?' active':''}" data-mode-idx="${i}" style="--mode-color:${m.color}">
            <span class="mode-degree">${m.degreeOffset+1}°</span>
            <span class="mode-note">${modeRoot}</span>
            <span class="mode-name">${modeText(i,'name')}</span>
            <span class="mode-sound">${modeText(i,'sound')}</span>
          </button>`;
        }).join('')}
      </div>
    </div>
  `:'';

  panel.innerHTML=`
    <div class="calc-type-row" style="flex-wrap:wrap;align-items:center;">
      <button class="calc-type-btn major${state.calcType==='major'?' active':''}" data-type="major">${I18N.t('type_major')}</button>
      <button class="calc-type-btn pmajor${state.calcType==='pmajor'?' active':''}" data-type="pmajor">${I18N.t('type_pmajor')}</button>
      <button class="calc-type-btn minor${state.calcType==='minor'?' active':''}" data-type="minor">${I18N.t('type_minor')}</button>
      <button class="calc-type-btn pminor${state.calcType==='pminor'?' active':''}" data-type="pminor">${I18N.t('type_pminor')}</button>
      ${diagBtn}
    </div>
    <div class="calc-formula-box">
      <div class="calc-formula-label" style="color:${displayColor}99;">${formulaLabel}</div>
      <div class="calc-formula-steps" id="calc-formula-steps">${formulaHTML}</div>
      ${displayNotes?`<div class="calc-result-notes">${I18N.t('lbl_notas')}: ${displayNotes.join(' · ')}</div>`:''}
      ${pentaNote}
    </div>
    ${modesSection}
    ${!state.calcRoot?`<div class="calc-hint">${I18N.t('calc_hint')}</div>`:''}
  `;

  panel.querySelectorAll('.calc-type-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      state.calcType=btn.dataset.type;
      state.calcModeIdx=0;
      state.calcModeFromRoot=false;
      renderCalcPanel();
      renderCalcDots();
    });
  });
  panel.querySelectorAll('.calc-mode-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      state.calcModeIdx=parseInt(btn.dataset.modeIdx);
      renderCalcPanel();
      renderCalcDots();
    });
  });
  panel.querySelectorAll('.mode-view-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      state.calcModeFromRoot=btn.dataset.fromRoot==='1';
      renderCalcPanel();
      renderCalcDots();
    });
  });
  document.getElementById('calc-diagonal-toggle')?.addEventListener('change',e=>{
    state.calcDiagonal=e.target.checked;
    renderCalcPanel();
    renderCalcDots();
  });
}

function renderCalcDots(){
  const dotsG=document.getElementById('fb-dots'); dotsG.innerHTML='';
  if(state.mode!=='calc'||!state.calcRoot) return;
  const formula=FORMULAS[state.calcType];
  const scaleNotes=buildScaleNotes(state.calcRoot.note, formula);
  // Mode support: rotate notes so mode root becomes degree 1
  let displayNotes=scaleNotes;
  let color=formula.color;
  if(state.calcType==='major'&&state.calcModeIdx>0){
    const mode=MODES[state.calcModeIdx];
    displayNotes=state.calcModeFromRoot
      ?buildScaleNotes(state.calcRoot.note,mode)
      :[...scaleNotes.slice(state.calcModeIdx),...scaleNotes.slice(0,state.calcModeIdx)];
    color=mode.color;
  }
  const positions=allPositionsOfNotes(displayNotes);
  state.calcPositions = positions; // store for quiz use

  if(state.calcDiagonal){
    // ── Diagonal mode ──────────────────────────────────────────────
    const path=buildDiagonalPath(displayNotes);

    // 1. Draw background dots (dimmed)
    positions.forEach(p=>{
      const cx=fretX(p.fret),cy=stringY(p.si);
      const c=makeDot(cx,cy,10,color+'22');
      dotsG.appendChild(c);
    });

    // 2. Draw connecting dashed lines
    for(let i=1;i<path.length;i++){
      const a=path[i-1],b=path[i];
      const line=document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',fretX(a.fret));line.setAttribute('y1',stringY(a.si));
      line.setAttribute('x2',fretX(b.fret));line.setAttribute('y2',stringY(b.si));
      line.setAttribute('stroke',color+'88');line.setAttribute('stroke-width','1.5');
      line.setAttribute('stroke-dasharray','5,3');
      dotsG.appendChild(line);
    }

    // 3. Draw path dots with sequence numbers
    path.forEach((p,i)=>{
      const cx=fretX(p.fret),cy=stringY(p.si);
      const isRoot=p.d===1;
      const r=isRoot?15:12;
      const fill=isRoot?color:color+'cc';
      const c=makeDot(cx,cy,r,fill);
      if(isRoot) c.setAttribute('filter','url(#glow)');
      dotsG.appendChild(c);
      // Note name
      const t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x',cx);t.setAttribute('y',cy+4);t.setAttribute('text-anchor','middle');
      t.setAttribute('font-size','8');t.setAttribute('font-weight','800');
      t.setAttribute('fill','#000');t.setAttribute('font-family','JetBrains Mono, monospace');
      t.textContent=noteAt(OPEN_NOTES[p.si],p.fret);dotsG.appendChild(t);
      // Sequence badge (top-right)
      const seq=document.createElementNS('http://www.w3.org/2000/svg','text');
      seq.setAttribute('x',cx+(isRoot?14:11));seq.setAttribute('y',cy-(isRoot?12:9));
      seq.setAttribute('font-size','9');seq.setAttribute('fill',color);
      seq.setAttribute('font-weight','800');seq.setAttribute('font-family','JetBrains Mono, monospace');
      seq.textContent=p.d;dotsG.appendChild(seq);
      // Slide indicator
      if(p.pathSlide){
        const sl=document.createElementNS('http://www.w3.org/2000/svg','text');
        sl.setAttribute('x',cx);sl.setAttribute('y',cy-18);
        sl.setAttribute('text-anchor','middle');sl.setAttribute('font-size','10');
        sl.setAttribute('fill','#00c9b1');sl.setAttribute('font-family','JetBrains Mono, monospace');
        sl.textContent='↗';dotsG.appendChild(sl);
      }
    });

  } else {
    // ── Normal mode ─────────────────────────────────────────────────
    positions.forEach(p=>{
      const cx=fretX(p.fret), cy=stringY(p.si);
      const isRoot=p.d===1;
      const r=isRoot?15:11;
      const fill=isRoot?color:color+'88';
      const c=makeDot(cx,cy,r,fill);
      if(isRoot) c.setAttribute('filter','url(#glow)');
      dotsG.appendChild(c);
      const t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x',cx);t.setAttribute('y',cy+4);t.setAttribute('text-anchor','middle');
      t.setAttribute('font-size','8');t.setAttribute('font-weight','800');
      t.setAttribute('fill','#000');t.setAttribute('font-family','JetBrains Mono, monospace');
      t.textContent=noteAt(OPEN_NOTES[p.si],p.fret);dotsG.appendChild(t);
      const deg=document.createElementNS('http://www.w3.org/2000/svg','text');
      deg.setAttribute('x',cx+(isRoot?13:10));deg.setAttribute('y',cy-(isRoot?12:9));
      deg.setAttribute('font-size','8');deg.setAttribute('fill',color);
      deg.setAttribute('font-weight','800');deg.setAttribute('font-family','JetBrains Mono, monospace');
      deg.textContent=p.d;dotsG.appendChild(deg);
    });
  }
}

function handleCalcClick(svgX,svgY){
  let best=null,bestDist=Infinity;
  for(let si=0;si<6;si++){
    for(let fret=0;fret<=12;fret++){
      const cx=fretX(fret),cy=stringY(si);
      const d=Math.hypot(svgX-cx,svgY-cy);
      if(d<bestDist){bestDist=d;best={si,fret};}
    }
  }
  if(bestDist>28) return;
  const {si,fret}=best;
  const note=noteAt(OPEN_NOTES[si],fret);
  state.calcRoot={si,fret,note};
  renderCalcPanel();
  renderCalcDots();
}

// ─── Editor ──────────────────────────────────────────────────────────
function enterEditMode(scaleId){
  state.editScaleId=scaleId||Object.keys(SCALES)[0];
  const scale=SCALES[state.editScaleId];
  state.editDots=JSON.parse(JSON.stringify(scale.positions[0]||[]));
  state.editDegree=1;
  document.querySelector('.fretboard-inner').classList.add('edit-mode-active');
}

function renderEditorPanel(){
  const panel=document.getElementById('editor-panel');
  if(state.mode!=='edit'){panel.style.display='none';document.querySelector('.fretboard-inner').classList.remove('edit-mode-active');return;}
  panel.style.display='block';
  document.querySelector('.fretboard-inner').classList.add('edit-mode-active');
  if(!state.editScaleId) enterEditMode(null);
  const scale=SCALES[state.editScaleId];

  panel.innerHTML=`
    <div class="editor-row">
      <span class="editor-label">${I18N.t('editor_scale')}</span>
      <select class="editor-select" id="edit-scale-sel">
        ${Object.entries(SCALES).map(([id,s])=>`<option value="${id}"${id===state.editScaleId?' selected':''}>${scaleText(id,'name')}</option>`).join('')}
      </select>
    </div>
    <div class="editor-row">
      <span class="editor-label">${I18N.t('editor_degree')}</span>
      ${[1,2,3,4,5,6,7].map(d=>`<button class="deg-btn${state.editDegree===d?' active':''}" data-deg="${d}" style="--edit-color:${scale.color}">${d}</button>`).join('')}
    </div>
    <div class="editor-hint">${I18N.t('editor_hint')}</div>
    <div class="editor-actions">
      <button class="btn-save" id="btn-save-scale">${I18N.t('editor_save')}</button>
      <button class="btn-clear" id="btn-clear-pos">${I18N.t('editor_clear')}</button>
      <button class="btn-reset" id="btn-reset-scale">${I18N.t('editor_reset')}</button>
      <span class="editor-saved" id="editor-saved">${I18N.t('editor_saved')}</span>
    </div>
  `;

  panel.querySelector('#edit-scale-sel').addEventListener('change',e=>{
    enterEditMode(e.target.value);
    renderEditorPanel();
    renderEditorDots();
  });
  panel.querySelectorAll('.deg-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      state.editDegree=parseInt(btn.dataset.deg);
      renderEditorPanel();
    });
  });
  panel.querySelector('#btn-save-scale').addEventListener('click',()=>{
    // Commit editDots as position[0] of the selected scale
    SCALES[state.editScaleId].positions[0]=JSON.parse(JSON.stringify(state.editDots));
    saveCustomScales();
    const saved=document.getElementById('editor-saved');
    saved.classList.add('show');
    setTimeout(()=>saved.classList.remove('show'),2000);
  });
  panel.querySelector('#btn-clear-pos').addEventListener('click',()=>{
    state.editDots=[];
    renderEditorDots();
  });
  panel.querySelector('#btn-reset-scale').addEventListener('click',()=>{
    resetCustomScale(state.editScaleId);
    // Reload page to restore default data
    location.reload();
  });
}

function renderEditorDots(){
  const dotsG=document.getElementById('fb-dots'); dotsG.innerHTML='';
  if(state.mode!=='edit') return;
  const scale=SCALES[state.editScaleId]||Object.values(SCALES)[0];
  state.editDots.forEach(p=>{
    const cx=fretX(p.fret),cy=stringY(p.si);
    const isRoot=p.d===1;
    const col=isRoot?scale.color:scale.color+'88';
    const c=makeDot(cx,cy,isRoot?14:11,col);
    if(isRoot) c.setAttribute('filter','url(#glow)');
    dotsG.appendChild(c);
    const noteName=noteAt(OPEN_NOTES[p.si],p.fret);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',cx);t.setAttribute('y',cy+4);t.setAttribute('text-anchor','middle');
    t.setAttribute('font-size','9');t.setAttribute('font-weight','800');
    t.setAttribute('fill',isRoot?'#fff':'#000');t.setAttribute('font-family','JetBrains Mono, monospace');
    t.textContent=noteName;dotsG.appendChild(t);
    // Degree badge
    const deg=document.createElementNS('http://www.w3.org/2000/svg','text');
    deg.setAttribute('x',cx+(isRoot?12:10));deg.setAttribute('y',cy-(isRoot?12:10));
    deg.setAttribute('font-size','8');deg.setAttribute('fill',scale.color);
    deg.setAttribute('font-weight','700');deg.setAttribute('font-family','JetBrains Mono, monospace');
    deg.textContent=p.d;dotsG.appendChild(deg);
  });
}

// SVG click handler (edit mode)
function handleFretClick(svgX,svgY){
  let best=null,bestDist=Infinity;
  for(let si=0;si<6;si++){
    for(let fret=0;fret<=12;fret++){
      const cx=fretX(fret),cy=stringY(si);
      const d=Math.hypot(svgX-cx,svgY-cy);
      if(d<bestDist){bestDist=d;best={si,fret};}
    }
  }
  if(bestDist>28) return;
  const {si,fret}=best;
  const idx=state.editDots.findIndex(p=>p.si===si&&p.fret===fret);
  if(idx>=0){ state.editDots.splice(idx,1); }
  else{ state.editDots.push({si,fret,d:state.editDegree}); }
  renderEditorDots();
}

// ─── Render ─────────────────────────────────────────────────────────
function render(){
  const hideAll=()=>{
    document.getElementById('legend').style.display='none';
    document.getElementById('pos-nav').style.display='none';
    document.getElementById('scale-info').style.display='none';
    document.getElementById('quiz-panel').style.display='none';
    document.getElementById('editor-panel').style.display='none';
    document.getElementById('calc-panel').style.display='none';
    document.getElementById('scale-grid').closest('.scale-section').style.display='none';
    document.querySelector('.fretboard-inner').classList.remove('edit-mode-active','calc-mode-active');
  };
  if(state.mode==='edit'){
    hideAll();
    renderEditorPanel();
    renderEditorDots();
    return;
  }
  if(state.mode==='calc'){
    hideAll();
    renderCalcPanel();
    renderCalcDots();
    return;
  }
  document.getElementById('scale-grid').closest('.scale-section').style.display='';
  document.getElementById('editor-panel').style.display='none';
  document.getElementById('calc-panel').style.display='none';
  document.querySelector('.fretboard-inner').classList.remove('edit-mode-active','calc-mode-active');
  renderDots();
  renderLegend();
  renderPosNav();
  renderScaleInfo();
  if(state.mode==='quiz') generateQuiz();
  else document.getElementById('quiz-panel').style.display='none';
}

// ─── Scale Buttons ───────────────────────────────────────────────────
function buildScaleButtons(){
  const grid=document.getElementById('scale-grid');
  grid.innerHTML='';
  Object.entries(SCALES).forEach(([id,scale])=>{
    const btn=document.createElement('button');
    btn.dataset.scaleId=id;
    btn.style.setProperty('--accent',scale.color);
    btn.innerHTML=`${scaleText(id,'name')}<span class="scale-sub">${scaleText(id,'sub')}</span>`;
    const active=state.selectedScale===id;
    btn.className='scale-btn'+(active?' active':'');
    btn.style.borderColor=active?scale.color:'#2a2a2a';
    btn.style.background=active?scale.color+'22':'#1a1a1a';
    btn.style.color=active?scale.color:'#666';
    btn.addEventListener('click',()=>{
      state.selectedScale=state.selectedScale===id?null:id;
      state.positionIdx=0;
      state.quizScore=0;state.quizTotal=0;
      buildScaleButtons();
      render();
    });
    grid.appendChild(btn);
  });
}

// ─── Metronome ────────────────────────────────────────────────────────
// Usa GuitarShared.metronome (scheduler Web Audio con lookahead, sin jitter).
const METRO_LS_KEY = 'maru_metro_escalas';
let metro = null;
let metroTapTimes = [];
let metroTapTimer = null;

function metroLoadSettings(){
  try{
    const s = JSON.parse(localStorage.getItem(METRO_LS_KEY) || '{}');
    if(s.bpm)    state.metroBpm    = Math.max(40, Math.min(220, s.bpm));
    if(s.compas) state.metroCompas = Math.max(2, Math.min(7, s.compas));
    if(s.sub)    state.metroSub    = Math.max(1, Math.min(8, s.sub));
    if(typeof s.subMuted === 'boolean') state.metroSubMuted = s.subMuted;
  }catch(e){}
}
function metroSaveSettings(){
  try{
    localStorage.setItem(METRO_LS_KEY, JSON.stringify({
      bpm: state.metroBpm, compas: state.metroCompas,
      sub: state.metroSub, subMuted: state.metroSubMuted,
    }));
  }catch(e){}
}

function metroEnsure(){
  if(metro) return metro;
  const NS = window.GuitarShared && window.GuitarShared.metronome;
  if(!NS) return null;
  metro = new NS.Metronome({
    bpm: state.metroBpm,
    beatsPerCompas: state.metroCompas,
    subdivision: state.metroSub,
    subdivisionsMuted: state.metroSubMuted,
    onTick: metroOnTick,
  });
  return metro;
}

// Reconstruye la fila de tiempos (compás) y la de sub-pips (subdivisión).
function metroRenderViz(){
  const beats = document.getElementById('metro-beats');
  beats.innerHTML = '';
  for(let i=0;i<state.metroCompas;i++){
    const d = document.createElement('div');
    d.className = 'metro-beat-dot' + (i===0 ? ' downbeat' : '');
    beats.appendChild(d);
  }
  const subs = document.getElementById('metro-subs');
  subs.innerHTML = '';
  for(let i=0;i<state.metroSub;i++){
    const p = document.createElement('div');
    p.className = 'metro-sub-pip';
    subs.appendChild(p);
  }
}
function metroClearViz(){
  document.querySelectorAll('#metro-viz .on').forEach(el=>el.classList.remove('on'));
}
function metroOnTick(e){
  const beats = document.querySelectorAll('#metro-beats .metro-beat-dot');
  beats.forEach((d,i)=> d.classList.toggle('on', i===e.beatInBar));
  const subs = document.querySelectorAll('#metro-subs .metro-sub-pip');
  subs.forEach((p,i)=> p.classList.toggle('on', i===e.tickInBeat));
}

function metroSetBpm(bpm){
  state.metroBpm = Math.max(40, Math.min(220, Math.round(bpm) || 80));
  document.getElementById('metro-bpm-val').value = state.metroBpm;
  if(metro) metro.setBPM(state.metroBpm);
  metroSaveSettings();
}

// Tap tempo: promedia los intervalos de los últimos taps.
function metroTap(){
  const now = performance.now();
  metroTapTimes.push(now);
  if(metroTapTimes.length > 5) metroTapTimes.shift();
  if(metroTapTimes.length >= 2){
    let sum = 0;
    for(let i=1;i<metroTapTimes.length;i++) sum += metroTapTimes[i]-metroTapTimes[i-1];
    metroSetBpm(60000 / (sum / (metroTapTimes.length-1)));
  }
  const btn = document.getElementById('metro-tap');
  btn.classList.add('tap-pulse');
  setTimeout(()=>btn.classList.remove('tap-pulse'), 110);
  clearTimeout(metroTapTimer);
  metroTapTimer = setTimeout(()=>{ metroTapTimes = []; }, 2000);
}

function startMetro(){
  const m = metroEnsure();
  if(!m) return;
  m.setBPM(state.metroBpm);
  m.setBeatsPerCompas(state.metroCompas);
  m.setSubdivision(state.metroSub);
  m.setSubdivisionsMuted(state.metroSubMuted);
  m.start();
  state.metroPlaying = true;
  const btn = document.getElementById('metro-play');
  btn.className = 'metro-btn metro-on';
  btn.textContent = I18N.t('metro_stop');
}
function stopMetro(){
  if(metro) metro.stop();
  state.metroPlaying = false;
  const btn = document.getElementById('metro-play');
  btn.className = 'metro-btn';
  btn.textContent = I18N.t('metro_play');
  metroClearViz();
}

metroLoadSettings();
document.getElementById('metro-bpm-val').value = state.metroBpm;
document.getElementById('metro-compas').value = String(state.metroCompas);
document.getElementById('metro-sub').value = String(state.metroSub);
document.getElementById('metro-submute').checked = state.metroSubMuted;
metroRenderViz();

document.getElementById('metro-play').addEventListener('click',()=>{ state.metroPlaying ? stopMetro() : startMetro(); });
document.getElementById('metro-down5').addEventListener('click',()=> metroSetBpm(state.metroBpm-5));
document.getElementById('metro-down1').addEventListener('click',()=> metroSetBpm(state.metroBpm-1));
document.getElementById('metro-up1').addEventListener('click',()=> metroSetBpm(state.metroBpm+1));
document.getElementById('metro-up5').addEventListener('click',()=> metroSetBpm(state.metroBpm+5));
document.getElementById('metro-bpm-val').addEventListener('change',e=> metroSetBpm(Number(e.target.value)));
document.getElementById('metro-tap').addEventListener('click', metroTap);
document.getElementById('metro-compas').addEventListener('change',e=>{
  state.metroCompas = Number(e.target.value) || 4;
  if(metro) metro.setBeatsPerCompas(state.metroCompas);
  metroRenderViz();
  metroSaveSettings();
});
document.getElementById('metro-sub').addEventListener('change',e=>{
  state.metroSub = Number(e.target.value) || 1;
  if(metro) metro.setSubdivision(state.metroSub);
  metroRenderViz();
  metroSaveSettings();
});
document.getElementById('metro-submute').addEventListener('change',e=>{
  state.metroSubMuted = e.target.checked;
  if(metro) metro.setSubdivisionsMuted(state.metroSubMuted);
  metroSaveSettings();
});

// ─── Mode tabs ───────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    state.mode=tab.dataset.mode;
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    state.positionIdx=0;
    render();
  });
});

// ─── Init ─────────────────────────────────────────────────────────────
loadCustomScales();  // apply any saved overrides before rendering
initFretboard();

// SVG click → edit / calc mode
document.getElementById('fretboard').addEventListener('click',function(e){
  if(state.mode!=='edit'&&state.mode!=='calc') return;
  const rect=this.getBoundingClientRect();
  const scaleX=SVG_W/rect.width, scaleY=SVG_H/rect.height;
  const svgX=(e.clientX-rect.left)*scaleX, svgY=(e.clientY-rect.top)*scaleY;
  if(state.mode==='edit') handleFretClick(svgX,svgY);
  else handleCalcClick(svgX,svgY);
});

buildScaleButtons();
render();
